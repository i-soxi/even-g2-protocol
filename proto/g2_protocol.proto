  string Container_Name = 2;
  uint32 ContentOffset = 3;
  uint32 ContentLength = 4;
  string Content = 5;
}

message ImageRawDataUpdateFields {
  uint32 Container_ID = 1;
  string Container_Name = 2;
  uint32 mapSessionId = 3;
  uint32 mapTotalSize = 4;
  uint32 compressMode = 5;
  uint32 mapFragmentIndex = 6;
  uint32 mapFragmentPacketSize = 7;
  bytes mapRawData = 8;
}

message ShutDownContaniner {
  uint32 exitMode = 1;                // 0=exit immediately, 1=prompt user
}


// =============================================================================
// EvenHub SDK Events (glasses → Flutter → WebView)
// =============================================================================

message ListItemEvent {
  uint32 Container_ID = 1;
  string Container_Name = 2;
  string CurrentSelect_ItemName = 3;
  uint32 CurrentSelect_ItemIndex = 4;
  OsEventType Event_Type = 5;
}

message TextItemEvent {
  uint32 Container_ID = 1;
  string Container_Name = 2;
  OsEventType Event_Type = 3;
}

message SysItemEvent {
  OsEventType Event_Type = 1;
}

// Audio at SDK level (post-LC3 decode by Flutter)
message AudioEventPayload {
  bytes audioPcm = 1;                 // 3200 bytes = 1600 samples @ 16kHz = 100ms
}

message EvenHubEvent {
  ListItemEvent listEvent = 1;
  TextItemEvent textEvent = 2;
  SysItemEvent sysEvent = 3;
  AudioEventPayload audioEvent = 4;
}

// Audio control (WebView → Flutter → BLE)
// Triggers Flutter to send mic enable/disable via its own GATT connection
message AudioControl {
  bool isOpen = 1;
}
