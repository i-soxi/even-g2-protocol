// =============================================================================
// SERVICE 0x0D: NAVIGATION / SCREEN STATE [app: navigation_main_msg_ctx, Navigation_Cmd_list]
// =============================================================================

// 0x0D-00: Navigation Init (glasses→phone, 1 packet per init)
// Official: navigation_main_msg_ctx, Navigation_Cmd_list
// UNUSUAL: No type field (field 1 missing), just msg_id + payload
// C1-C6: {2:15, 3:(empty)}
// C7:    {2:15, 3:{f1:1, f2:3}} ★ — nav state with page+mode!
//        f1=1 possibly = dashboard/main, f2=3 = current sub-state or page count
message NavigationInit {
  uint32 msg_id = 2;                  // 15
  NavigationInitPayload payload = 3;  // Often empty, but C7 has {f1:1, f2:3}
}

message NavigationInitPayload {
  uint32 current_page = 1;            // 1=dashboard/main (C7), absent in C1-C6
  uint32 state = 2;                   // 3=navigation state (C7), absent in C1-C6
}

// 0x0D-01: Screen State Push (glasses→phone, 20/42/27/37/46 packets — very frequent)
// Unsolicited screen/page change notifications. NO msg_id field.
// Reports which screen/page is currently active on the glasses.
//
// Observed page values (f3.f1):
//   0/absent:  home screen (f3=(empty))
//   1:         main app active (generic EvenHub / dashboard)
//   5:         AI screen (capture 2, with 0x05 service)
//   6:         Teleprompter screen (capture 2, with 0x06 service)
//              Also: post-Conversate result display (capture 3)
//   8:         AI Voice screen (capture 3, with 0x08 service)
//   11:        Conversate screen (capture 3, with 0x0B service)
//   224:       Third-party App screen ★ NEW (capture 4, 0xE0) — service ID = screen ID!
//   266:       Unknown screen (0x10A, capture 4, brief appearance at t=286s)
//
// Sub-page values (f3.f2):
//   3:         transition state (mic start/stop, page changes, session mid)
//   4:         secondary state (settings, idle, app page)
//   7:         mic session detail (f3={f1:1, f2:7} during active dashboard mic)
// 0x0D-01: Screen State (glasses→phone, 20/42/27/37/46/42 packets — very active)
// Continuous push of current screen page state. No type field, no msg_id.
// Sent whenever the display context changes.
//
// New field: state="" (empty string) = home/idle screen (no active feature)
//            state = {f1=page} = active feature page
//            state = {f1=page, f2=sub_page} = feature sub-state
//
// Confirmed page→service mapping (6 captures):
//   page=1   ↔ 0x07 Dashboard / Even home / Notifications
//   page=5   ↔ 0x05 AI service — Translate mode ★ confirmed C6
//   page=6   ↔ 0x06 Teleprompter
//   page=8   ↔ 0x08 AI Voice session
//   page=11  ↔ 0x0B Conversate (transcription)
//   page=224 ↔ 0xE0 App Runtime + Navigation ★ (C4)
//   page=266 ↔ 0x09 Device settings (or unknown app)
//
// Confirmed sub_page values:
//   3:  Feature activation transition (appears briefly after double-tap)
//   4:  Notification detail/card view ★ confirmed C6
//   7:  MIC active overlay ★ confirmed C6 (during AI voice mic-on)
//   34: Streaming/processing overlay (universal: with tele, voice, translate, conversate)
//
// Screen-to-service correlation (confirmed across 6 captures):
//   page=1   ↔ 0x07 Dashboard
//   page=5   ↔ 0x05 AI heartbeats + state (Translate)
//   page=6   ↔ 0x06 Teleprompter heartbeats + responses
//   page=8   ↔ 0x08 AI Voice session
//   page=11  ↔ 0x0B Conversate heartbeats + state
//   page=224 ↔ 0xE0 App Runtime + Navigation ★ NEW
//   page=266 ↔ 0x09 Device settings (or unknown app)
message ScreenStatePush {
  uint32 type = 1;                     // Always 1
  ScreenStatePayload state = 3;       // No msg_id field (field 2 absent!)
}

message ScreenStatePayload {
  uint32 page = 1;                     // 0=none, 1=home/dash, 5=translate, 6=tele, 8=voice, 11=conversate, 224=E0 app, 266=unknown
  uint32 sub_page = 2;                // 3=transition, 4=notif detail, 7=mic active, 34=streaming overlay
}


// =============================================================================
// SERVICE 0x0E: G2 SETTING / DISPLAY SETTINGS [app: G2SettingPackage, g2_settingCommandId]
// =============================================================================

// 0x0E-00: Display Settings / G2 Setting (glasses→phone, 27/10/22/11/11/10/29 packets)
// Official name: G2SettingPackage (from app binary)
// Official command enum: g2_settingCommandId
// Three sub-types:
//   type=1: Parameter with float value — dashboard display geometry
//   type=2: Simple ACK — {f4.f1=1} — confirms page transition
//   type=4: Display mode / layout — references param IDs 5+6
//
// Float parameters (confirmed across 7 captures):
//   param_id=2: int=10000, float=103.0→113.0   — page width/position (changes on expand!)
//   param_id=3: int=2000,  float=207.0→222.0   — page height/position (changes on expand!)
//   param_id=5: float=91.0                       — viewport X offset (stable)
//   param_id=6: float=93.0                       — viewport Y offset (stable)
// Params sent in pairs: (5+6) then (2+3) during init, reversed on page transitions
//
// ★ C7 DECODE (29 packets — dashboard navigation via ring scroll):
//   Init (t=19s): type=4 mode, then params 5,6,2,3,5,6,3,2 (full geometry setup)
//   Scroll events interleave with type=2 ACKs:
//     t=28-29s: 3× type=2 ACKs (pages 4→3→2→1 scroll)
//     t=33s:    type=2 ACK (page 1 click → expand)
//   Page expand changes params 2+3 to larger values:
//     Normal: param2=103.0, param3=207.0
//     Expanded: param2=113.0, param3=222.0
//   type=4 mode packets appear at page boundaries (4-5 per session)
//     Always contains entries [{param_ref:5}, {param_ref:6}] — viewport reset
message DisplaySettings {
  uint32 type = 1;                     // 1=param, 2=ACK, 4=mode
  uint32 msg_id = 2;
  DisplayParam param = 3;             // type=1
  DisplaySettingsAck ack = 4;         // type=2
  DisplayMode mode = 6;               // type=4
}

message DisplayParam {
  uint32 param_id = 1;                // Parameter identifier (2,3,5,6 confirmed)
  uint32 int_value = 2;               // Integer value (present for params 2,3)
  fixed32 float_value = 3;            // IEEE 754 float (present for all params)
}

message DisplaySettingsAck {
  uint32 status = 1;                   // 1 = success
}

message DisplayMode {
  repeated DisplayModeEntry entries = 1;
}

message DisplayModeEntry {
  uint32 param_ref = 1;               // References param_id: 6 confirmed (C2)
}

// 0x0E-20: Display Config Push (phone→glasses, write-only)
// Sends display configuration parameters to glasses
message DisplayConfigPush {
  uint32 type = 1;                     // 2
  uint32 msg_id = 2;
  DisplayConfigPayload config = 4;
}

message DisplayConfigPayload {
  uint32 enabled = 1;
  repeated DisplayConfigRegion regions = 2;
}

message DisplayConfigRegion {
  uint32 region_id = 1;               // 2, 3, 4, 5, 6
  uint32 int_param = 2;
  float float_param1 = 3;
  float float_param2 = 4;
  uint32 param3 = 5;
  uint32 param4 = 6;
}


