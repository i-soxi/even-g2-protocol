// =============================================================================
// SERVICE 0xE0: APP RUNTIME [app: module_configure? EvenHub extended?]
// =============================================================================

// 0xE0 is a THIRD-PARTY APP service channel. The EvenHub SDK app running on
// the glasses reports its UI navigation state and feature toggles through this
// dedicated high-numbered service range (0xE0 = 224).
//
// Key discovery: Service ID = Screen ID! When the app is active, 0x0D-01
// reports page=224 (0xE0), directly matching the service ID.
//
// The app registers three screen names visible in E0-01 navigation data:
//   "menu"     — main settings/options menu (level=1)
//   "chatNav"  — chat navigation / message list (level=1)
//   "actions"  — action options for a chat message (level=2)
//
// Discovered in Capture 4 (141920): User toggled silent mode on/off.
// Silent mode is activated via physical TOUCH BUTTONS on both L and R arms
// (not a software menu toggle). The E0-00 type=16 reports the hardware
// toggle state, while E0-01 shows the user navigating the menu to the
// silent mode setting ("menu" idx=4) around the same time.

// 0xE0-00: App Runtime ACK (glasses→phone, 83/50 packets in C4/C5)
// Multi-type message with 5 confirmed sub-types.
// Uses standard {f1=type, f2=seq} envelope.
//
// Type mapping (type → field, follows type+2 convention with exceptions):
//   type=1:  App Init ACK — f4=(empty), sent once when app screen opens
//   type=8:  UI Interaction ACK — f8.f1=7 (always 7, current app context)
//            Burst-fires during active navigation, aligns with E0-01 nav events
//   type=10: Cross-Screen Reference — f12.f1=screen_id
//            C4: screen_id=11 (Conversate), C5: screen_id=10 (0x0A, unknown)
//            References another screen's page ID. Appears once near session end.
//   type=12: App Heartbeat — f15.f2=12 (always 12), ~5s periodic interval
//            Spans entire app session from launch to exit
//   type=16: Feature Toggle — f19.f1=1 (enabled), f19=(empty) (disabled)
//            ★ SILENT MODE: Physical touch button on L+R arms
//            C4: one toggle cycle. C5: TWO toggle cycles observed.
//
// C5 confirms full pattern: init(t=189s) → HB+nav(t=197-254s) →
//   silent ON(t=235s) → OFF(t=243s) → ON(t=251s) → OFF(t=254s) →
//   cross-ref(t=268s, screen_id=10)
message AppRuntimeAck {
  uint32 type = 1;                     // 1, 8, 10, 12, 16
  uint32 msg_id = 2;                  // Sequential (54→238)
  AppRuntimeInit init = 4;            // type=1: init ACK (empty)
  AppRuntimeNavEvent nav_event = 8;   // type=8: UI interaction ACK
  AppRuntimeScreenRef screen_ref = 12; // type=10: cross-screen reference
  AppRuntimeHeartbeat heartbeat = 15; // type=12: periodic keep-alive
  AppRuntimeToggle toggle = 19;       // type=16: feature toggle (silent mode!)
}

message AppRuntimeInit {
  // Empty in observed packet — app init acknowledgment
}

message AppRuntimeNavEvent {
  uint32 context = 1;                  // 7 = current app context (always 7 in C4)
}

message AppRuntimeScreenRef {
  uint32 screen_id = 1;               // Screen ID ref: 11=Conversate (C4), 10=unknown (C5)
}

message AppRuntimeHeartbeat {
  uint32 interval_id = 2;             // 12 = heartbeat marker (always 12 in C4)
}

message AppRuntimeToggle {
  uint32 enabled = 1;                  // 1=enabled (present), absent/0=disabled
  // When enabled=1 (f19.f1=1): feature ON (e.g., silent mode activated)
  // When field absent (f19=(empty)): feature OFF (e.g., silent mode deactivated)
  // Silent mode is triggered by physical touch buttons on both L and R arms
}


// 0xE0-01: App Navigation Push (glasses→phone, 39 packets in C4)
// Unsolicited UI navigation state from the app to the phone.
// Always type=2, payload exclusively in field 13 (high field number).
//
// Two payload variants in f13:
//   f13.f1 = Navigation event: screen name + optional menu item index
//     f1.f1 = level (1=primary, 2=secondary)
//     f1.f2 = screen name string ("menu", "chatNav", "actions")
//     f1.f4 = menu item index (1-based, optional)
//
//   f13.f3 = Screen state transition:
//     (empty) = idle/transitional state (between navigations)
//     f3.f1=3 = active (after entering chatNav)
//     f3.f1=4 = page state A (one of a toggle pair)
//     f3.f1=5 = page state B (other of a toggle pair)
//     f3.f1=7 = exit/final state (appears once at session end)
//
// Menu item indices observed for "menu" screen:
//   idx=1: first item, idx=3: third, idx=4: silent mode!, idx=5: fifth
// The f13.f3.f1 cycling between 4↔5 (t=175-225s) correlates with
// 0D-01 page changes and represents browsing through app sub-pages.
//
// Navigation flow example (C4):
//   t=45s  idle → t=55s "actions" → t=66s "actions" idx=1 → t=67s "chatNav"
//   → t=69s "menu" → t=80s "chatNav" → t=82s "menu" idx=1
//   → t=94s "actions" idx=3 → t=98s "chatNav" → t=105s "menu" idx=4
//   → t=105.9s SILENT MODE ON → t=111s idle → t=111.4s SILENT MODE OFF
//   → ... more navigation ... → t=225s state=7 (exit app)
message AppNavigationPush {
  uint32 type = 1;                     // Always 2
  AppNavigationPayload navigation = 13; // High field number (same as heartbeat cmd)
}

message AppNavigationPayload {
  AppNavScreen screen = 1;            // Navigation event: screen + optional index
  AppNavState state = 3;              // Screen state transition
}

message AppNavScreen {
  uint32 level = 1;                    // 1=primary (menu, chatNav), 2=secondary (actions)
  string name = 2;                     // "menu", "chatNav", "actions"
  uint32 item_index = 4;              // Menu item index, 1-based (optional)
}

message AppNavState {
  uint32 page_state = 1;              // 3=active, 4/5=page toggle pair, 7=exit
}


