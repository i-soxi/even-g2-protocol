// t=22.7s  0x01-00  General ACK: bulk ACKs (msg_ids 21→40)
// t=25.3s  0x80-00  Heartbeat: type=6 (session established)
//
// COMMON ENVELOPE PATTERN:
//   field 1 (varint) = message type / sub-command
//   field 2 (varint) = message ID (monotonic sequence)
//   field 3 (LEN)    = primary response payload (type=1 responses)
//   field 4 (LEN)    = secondary payload (type=2 responses)
//   field 5 (LEN)    = tertiary payload (type=3 responses)
//   field 6 (LEN)    = quaternary payload (type=4 responses)
//   Higher fields (8, 11, 13, 128) = service-specific
//
// ============================================================================

syntax = "proto3";

package even.g2;


