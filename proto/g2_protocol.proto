// =============================================================================
// SERVICE 0x01: GENERAL / APP [app: service_id_def, common]
// =============================================================================

// 0x01-00: General ACK (glasses→phone, 11/20/27 packets)
// Bulk ACKs during init — acknowledges multiple commands with sequential msg_ids
// type=1: standard ACK (most packets, all with empty field 3)
// type=6: extended ACK — f8.f1=9 (C2), f8.f1=10 (C3) — context-dependent
message GeneralAck {
  uint32 type = 1;                     // 1=ACK, 6=extended
  uint32 msg_id = 2;
  GeneralAckPayload payload = 3;      // type=1: usually empty
  GeneralAckExtended extended = 8;    // type=6: {f1=9 or f1=10}
}

message GeneralAckPayload {
  // Empty in all observed type=1 packets
}

message GeneralAckExtended {
  uint32 code = 1;                     // 9 (C2) or 10 (C3) — session context?
}

// 0x01-01: Event Stream (glasses→phone, 9/26/30/6/35/17/28 packets observed)
// Touch/gesture events with monotonic counter. Requires active EvenHub SDK session.
// Format: always type=3, magic=0x12345678, body has counter + event source/detail.
//
// FOUR event source types discovered (C1-C7):
//
//   source=1 (SCROLL): Ring scroll navigation between dashboard pages
//     detail.f1=1 (input=ring), detail.f2 = scroll direction:
//       {f1: from_page, f2: to_page} — scroll from one page to another
//       {f2: 1}                      — scroll to home (page 1), f1 absent
//     C7 example: 28 events showing full 5-page navigation:
//       counter 1328: {1:3, 2:4} → scroll from page 3 to page 4
//       counter 1329: {1:2, 2:3} → scroll from page 2 to page 3
//       counter 1331: {2:1}      → scroll to home (page 1)
//
//   source=1 (DOUBLE-TAP): Gesture pair with action_code (C6 pattern)
//     Two consecutive counters per double-tap (1312+1313, 1314+1315...)
//     detail.f1=1, detail.f2={1:4, 2:5} = feature activation code
//     Triggers: Notifications, Conversate, Teleprompter, Translate, Even AI
//
//   source=2-6 (PAGE CLICK): Click to expand a dashboard page
//     source = page_number + 1 (source=2 → page 1 click, source=6 → page 5)
//     Click data in field (source+1): f3=page1, f4=page2, f5=page3, f6=page4, f7=page5
//
//     ★ OFFICIAL DASHBOARD PAGE TYPES (from app binary PAGE_TYPE_* constants):
//       Page 1 (source=2): PAGE_TYPE_DASHBOARD_MAIN   — home/main dashboard
//       Page 2 (source=3): PAGE_TYPE_HEALTH_EXPANDED   — health (HR, SpO2, steps via R1 Ring)
//       Page 3 (source=4): PAGE_TYPE_CALENDAR_EXPANDED — calendar events
//       Page 4 (source=5): PAGE_TYPE_NEWS_EXPANDED     — news feed
//       Page 5 (source=6): PAGE_TYPE_STOCK_EXPANDED    — stock ticker
//       Also exists:      PAGE_TYPE_QUICKLIST_EXPANDED — quick list (position TBD)
//
//     C7 examples:
//       counter 1332: source=2, f3="" → click DASHBOARD_MAIN (page 1)
//       counter 1335: source=3, f4="" → click HEALTH_EXPANDED (page 2)
//       counter 1338: source=4, f5="" → click CALENDAR_EXPANDED (page 3)
//       counter 1341: source=5, f6={f4: timestamp} → click NEWS_EXPANDED (page 4)
//       counter 1344: source=6, f7="" → click STOCK_EXPANDED (page 5)
//       counter 1354: source=6, f7="" → click STOCK_EXPANDED (page 5, again)
//
//   lifecycle (2000+ range): Feature transition markers (C6 only)
//     counters 2080-2084, f3.f1=(empty), f3.f2=(empty)
//
// C6 gesture pattern (5 double-taps for 5 features):
//   t=40s:  1312+1313, 2080 → Notifications
//   t=73s:  1314+1315, 2081 → Conversate
//   t=136s: 1316+1317, 2082 → Teleprompter
//   t=201s: 1318+1319, 2083 → Translate
//   t=254s: 1320+1321, 2084 → Even AI
//
// C7 scroll+click pattern (dashboard navigation, 28 events):
//   t=28-31s:  scroll pages 4→3→2→1 then click page 1
//   t=33-37s:  scroll 1→2, click page 2
//   t=38-44s:  scroll 2→3, click page 3, click page 4
//   t=52-83s:  full page traversal 1↔5 with clicks
message EventStream {
  uint32 type = 1;                     // Always 3
  uint64 session_id = 2;              // Always 0x12345678 (305419896)
  EventStreamBody body = 6;
}

message EventStreamBody {
  uint32 counter = 1;                  // Monotonic: ~1312+ (scroll/click), ~2080+ (lifecycle)
  EventStreamEvent event = 5;
}

message EventStreamEvent {
  uint32 source = 1;                   // 1=scroll/double-tap, 2-6=page click (page=source-1)
  EventStreamScrollDetail detail = 2; // source=1: scroll direction or tap code
  EventStreamLifecycle lifecycle = 3;  // 2000+ range: lifecycle markers / source=2 page1 click
  EventStreamPageData health_page = 4;   // source=3: HEALTH_EXPANDED click (page 2)
  EventStreamPageData calendar_page = 5; // source=4: CALENDAR_EXPANDED click (page 3)
  EventStreamPageData news_page = 6;     // source=5: NEWS_EXPANDED click (page 4, has timestamp)
  EventStreamPageData stock_page = 7;    // source=6: STOCK_EXPANDED click (page 5)
  // source=2 uses field 3 (lifecycle position) for DASHBOARD_MAIN click — overloaded!
}

message EventStreamScrollDetail {
  uint32 input_source = 1;            // 1=ring scroll/tap
  EventStreamScrollDirection direction = 2; // scroll from/to page numbers
}

message EventStreamScrollDirection {
  uint32 from_page = 1;               // Page scrolled FROM (absent when going to page 1)
  uint32 to_page = 2;                 // Page scrolled TO (always present)
}

message EventStreamLifecycle {
  // Empty in 2000+ range (feature transition markers)
  // Also empty for source=2 page-1 clicks
}

message EventStreamPageData {
  uint32 timestamp = 4;               // Present on page 4 clicks (e.g., 491654398), absent on others
}

// 0x01-20: Auth/Init Command (phone→glasses, write-only)
// Sent during session init handshake
message AuthCommand {
  uint32 type = 1;
  uint32 msg_id = 2;
  AuthPayload auth = 3;
}

message AuthPayload {
  uint32 capability = 1;              // 0x01=basic, 0x04=full
}


// =============================================================================
// SERVICE 0x03: NOTIFICATIONS [app: NotificationDataPackage, eNotificationCommandId]
// =============================================================================

// 0x03-00: Notification ACK (glasses→phone, 3 packets observed)
// Init sequence ACKs. NOTE: uses field 4 (not field 3) for payload
message NotificationAck {
  uint32 type = 1;                     // Always 1
  uint32 msg_id = 2;
  NotificationAckPayload payload = 4; // NOTE: field 4, not 3
}

message NotificationAckPayload {
  // Empty in all observed packets
}

// 0x03-20: Notification Push (phone→glasses, write-only)
// Push notification metadata to glasses display
message NotificationPush {
  uint32 type = 1;
  uint32 msg_id = 2;
  NotificationData notification = 3;
}

message NotificationData {
  uint32 app_id = 1;                  // e.g., 0x1A = Gmail
  uint32 count = 2;                   // Number of notifications
}


// =============================================================================
// SERVICE 0x04: DISPLAY / EVENHUB [app: evenhub_main_msg_ctx, EvenHub_Cmd_List]
// =============================================================================
// Features: Teleprompter text, Navigation app direction images (0x04-21),
//           Calendar nav dot on LEFT arm, wake/sleep control.
//           Navigation app renders turn-by-turn direction indicator images
//           on the RIGHT display. Calendar shows minimal dot indicator on LEFT.

// 0x04-00: Display ACK (glasses→phone, 1 packet observed)
// Response to display wake/content commands
// Observed: {1:1, 2:25, 3:{1:1}}
message DisplayAck {
  uint32 type = 1;                     // 1
  uint32 msg_id = 2;
  DisplayAckPayload payload = 3;
}

message DisplayAckPayload {
  uint32 status = 1;                   // 1 = success
}

// 0x04-20: Display Command (phone→glasses, write-only)
// Used for display wake, teleprompter content, page management
// See Container Messages section below for payload formats
message DisplayWake {
  uint32 type = 1;                     // 1
  uint32 msg_id = 2;
  DisplayWakeSettings settings = 3;
}

message DisplayWakeSettings {
  uint32 field1 = 1;                   // 1
  uint32 field2 = 2;                   // 1
  uint32 field3 = 3;                   // 5
  uint32 field5 = 5;                   // 1
}


// =============================================================================
// SERVICE 0x05: EVEN AI / TRANSLATE [app: EvenAIDataPackage, TranslateDataPackage]
// =============================================================================
// Features: AI Agent chat (text response on RIGHT display),
//           translator (EN→FR voice-to-text) ★ confirmed C6.
//           Translate mode: screen page=5, 05-01 start/stop, 05-00 heartbeats.
//           The AI agent responds to voice queries with text displayed on R.
//           C6 timeline: 05-01 f5={1:1} start → 05-00 heartbeats → 05-01 f5={1:2} stop.

// 0x05-00: AI Heartbeat (glasses→phone, 12/6/8 packets)
// Periodic keep-alive during active AI/Translate session (~3s interval)
// Always type=162 with empty f7. msg_ids sequential.
// C2: 104→121 between mic-on/AI-end. C6: 115→124 during translate (213-225s).
// Correlates 1:1 with 0x0D-01 f3.f1=5 (AI/Translate screen active).
message AIHeartbeat {
  uint32 type = 1;                     // Always 162 (0xA2)
  uint32 msg_id = 2;                  // Sequential: 104→121
  AIHeartbeatPayload keepalive = 7;   // Always empty
}

message AIHeartbeatPayload {
  // Empty in all 12 observed packets — pure keep-alive signal
}

// 0x05-01: AI State Push (glasses→phone, 5/2/2 packets)
// Session lifecycle events for AI/speech/translate processing:
//   type=161: Session control — f5.f1=1 (start), f5.f1=2 (end/stop)
//   type=163: Processing state — f6.f1=1 (processing), f6=(empty) (idle)
//
// C2 timeline (AI agent chat):
//   t=122s  type=161 f5.f1=1  → AI session START
//   t=145s  type=163 f6.f1=1  → AI processing active
//   t=146s  type=163 f6=(empty) → AI processing idle
//   t=147s  type=163 f6.f1=1  → AI processing active again
//   t=156s  type=161 f5.f1=2  → AI session STOP
//
// C6 timeline (Translate EN→FR):
//   t=213.5s type=161 f5.f1=1  → Translate session START
//   t=224.8s type=161 f5.f1=2  → Translate session STOP
//   (No type=163 processing events — simpler session than AI agent chat)
message AIStatePush {
  uint32 type = 1;                     // 161 (0xA1) or 163 (0xA3)
  uint32 msg_id = 2;
  AISessionControl session = 5;       // type=161: start/stop
  AIProcessingState processing = 6;   // type=163: active/idle
}

message AISessionControl {
  uint32 state = 1;                    // 1=start, 2=stop
}

message AIProcessingState {
  uint32 active = 1;                   // 1=processing, absent/0=idle
}


// =============================================================================
// SERVICE 0x06: TELEPROMPTER [app: TelepromptDataPackage, TelepromptCommandId]
// =============================================================================

// 0x06-00: Teleprompter Heartbeat (glasses→phone, 8 packets) ★ NEW
// Periodic keep-alive during active teleprompter session (~6s interval)
// Always type=166 with empty f12. msg_ids 61→72.
// Active from t=48s (teleprompter open) to t=74s (teleprompter close).
message TeleprompterHeartbeat {
  uint32 type = 1;                     // Always 166 (0xA6)
  uint32 msg_id = 2;                  // Sequential: 61→72
  TeleprompterHeartbeatPayload keepalive = 12; // Always empty
}

message TeleprompterHeartbeatPayload {
  // Empty in all 8 observed packets — pure keep-alive signal
}

// 0x06-01: Teleprompter Response (glasses→phone, 9/6 packets) ★ NEW
// Unsolicited feedback from glasses during teleprompter session.
// 5 sub-types map to session lifecycle phases:
//
//   type=161: Session end    — f7.f1=4 (complete/close)
//   type=162: Session start  — f8=(empty) (ACK, teleprompter opened)
//   type=163: Script loaded  — f9.f1="teleprompt_createdId_XXXXXX" ★ SCRIPT ID!
//   type=164: Content ready  — f10=(empty) or f10.f1=1 (pages loaded)
//   type=165: Scroll/page    — f11.f2=N (current page/scroll position)
//
// C2 timeline (first teleprompter session):
//   t=48.0s  type=162 f8=(empty)    → teleprompter opened
//   t=50.2s  type=163 f9.f1="..."   → script loaded
//   t=50.3s  type=164 f10=(empty)   → content loading
//   t=50.5s  type=164 f10.f1=1      → content ready
//   t=63.4s  type=165 f11.f2=1      → user at page 1
//   t=63.8s  type=165 f11.f2=4      → scrolled to page 4
//   t=71.1s  type=165 f11.f2=5      → scrolled to page 5
//   t=71.5s  type=165 f11.f2=8      → scrolled to page 8
//   t=76.5s  type=161 f7.f1=4       → session closed
//
// C6 timeline (second teleprompter session, same script):
//   t=114.4s type=162 f8=(empty)    → teleprompter opened
//   t=139.4s type=162 f8=(empty)    → re-open (after brief exit?)
//   t=141.8s type=163 f9="teleprompt_createdId_1771967904374" ★ same ID
//   t=141.9s type=164 f10=(empty)   → content loading
//   t=142.0s type=164 f10.f1=1      → content ready
//   t=149.6s type=161 f7.f1=4       → session closed
message TeleprompterResponse {
  uint32 type = 1;                     // 161-165
  uint32 msg_id = 2;
  TeleprompterEndPayload end = 7;     // type=161: session close
  TeleprompterStartAck start = 8;     // type=162: session open ACK
  TeleprompterScriptLoaded script = 9; // type=163: script ID ★
  TeleprompterContentReady content = 10; // type=164: content state
  TeleprompterScrollState scroll = 11;  // type=165: scroll position
}

message TeleprompterEndPayload {
  uint32 reason = 1;                   // 4 = normal close
}

message TeleprompterStartAck {
  // Empty — just confirms teleprompter UI opened
}

message TeleprompterScriptLoaded {
  string script_id = 1;               // e.g., "teleprompt_createdId_1771967904374"
}

message TeleprompterContentReady {
  uint32 ready = 1;                    // 1 = all pages loaded, absent = loading
}

message TeleprompterScrollState {
  uint32 page = 2;                     // Current page/scroll position: 1,4,5,8 observed
}

// 0x06-20: Teleprompter Command (phone→glasses, write-only)
// Confirmed working in teleprompter_v2.py
message TeleprompterMessage {
  uint32 type = 1;                     // 1=init, 2=list, 3=content, 4=complete, 255=marker
  uint32 msg_id = 2;
  TeleprompterInit init = 3;          // type=1
  TeleprompterList list = 4;          // type=2
  TeleprompterContent content = 5;    // type=3
  TeleprompterComplete complete = 6;  // type=4
  TeleprompterMarker marker = 13;     // type=255
}

message TeleprompterInit {
  uint32 script_index = 1;
  TeleprompterDisplaySettings display = 2;
}

message TeleprompterDisplaySettings {
  uint32 field1 = 1;                   // Always 1
  uint32 field2 = 2;                   // Always 0
  uint32 field3 = 3;                   // Always 0
  uint32 display_width = 4;           // 267
  uint32 content_height = 5;          // Total content height
  uint32 line_height = 6;             // 230
  uint32 viewport_height = 7;         // 1294 (visible area)
  uint32 font_size = 8;               // 5
  uint32 scroll_mode = 9;             // 0=manual, 1=AI
}

message TeleprompterList {
  repeated TeleprompterScript scripts = 1;
}

message TeleprompterScript {
  string script_id = 1;               // e.g., "teleprompter_createdId_1766814694346"
  string title = 2;
}

message TeleprompterContent {
  uint32 page_number = 1;             // 0-indexed
  uint32 line_count = 2;              // Always 10
  bytes text = 3;                      // UTF-8 with \n separators
}

message TeleprompterComplete {
  uint32 start_page = 1;              // Always 0
  uint32 total_pages = 2;
  uint32 total_lines = 3;
}

message TeleprompterMarker {
  uint32 field1 = 1;                   // Always 0
  uint32 field2 = 2;                   // Always 6
}

message TeleprompterStart {
  uint32 type = 1;                     // 1
  uint32 msg_id = 2;
  TeleprompterStartPayload state = 3;
}

message TeleprompterStartPayload {
  uint32 state = 1;                    // 4 = START
}


// =============================================================================
// SERVICE 0x07: DASHBOARD [app: DashboardDataPackage, eDashboardCommandId]
// =============================================================================
// Features: Main dashboard with scrollable navigation on RIGHT display.
//           R1 Ring scroll input generates 0x01-01 Event Stream gestures
//           (scroll_position 0-4) for navigating dashboard items.
//           Mic trigger for voice commands + AI processing.

// 0x07-00: Dashboard ACK (glasses→phone, 33/26/29/21 packets — very active)
// Multi-type message with 8 confirmed sub-types:
//   type=1:  Mic state change — f3.f1=2(starting), f3.f1=3(stopped)
//   type=3:  Empty ACK — most common, sent during audio streaming
//   type=4:  Empty f6 — transitional (mic→streaming boundary)
//   type=5:  Display render complete — f7=(empty)
//   type=7:  Session result — f9.f1=5 ★ NEW (C4, at end of mic session)
//   type=9:  Post-mic-activate — f11.f1=1 (mic hardware ready)
//   type=10: Dashboard heartbeat — f13.f2=32 (counter variant) or f13=(empty)
//
// Capture 2 type=5 appears in triplets between audio streaming blocks:
//   t=98.7-98.9s (×3), t=105.7-105.8s (×3), t=111.7-111.9s (×1)
// Capture 4 type=7 f9.f1=5 at t=196.5s (mic session end, before 07-01 mic-off)
message DashboardAck {
  uint32 type = 1;                     // 1, 3, 4, 5, 7, 9, 10
  uint32 msg_id = 2;                  // Sequential 17→107
  DashboardAckMic mic = 3;            // type=1
  DashboardAckType5 render = 5;       // type=3 ACK (empty)
  DashboardAckType4 type4_data = 6;   // type=4
  DashboardAckRender display = 7;     // type=5: display render complete
  DashboardAckResult result = 9;      // type=7: session result ★ NEW (C4)
  DashboardAckReady ready = 11;       // type=9
  DashboardAckHeartbeat heartbeat = 13; // type=10
}

message DashboardAckMic {
  MicState state = 1;                  // 2=starting, 3=stopped
}

message DashboardAckType5 {
  // Empty — streaming ACK (type=3)
}

message DashboardAckType4 {
  // Empty in observed packets — transitional
}

message DashboardAckRender {
  // Empty — signals display render complete (type=5)
}

message DashboardAckResult {
  uint32 status = 1;                   // 5 observed — session result at mic end (type=7)
}

message DashboardAckReady {
  uint32 status = 1;                   // 1 = mic hardware ready
}

message DashboardAckHeartbeat {
  uint32 counter = 2;                  // 32 observed (absent in some packets)
}

// 0x07-01: Mic/AI State Push (glasses→phone, 4/4/6/3/0/2 packets)
// Unsolicited state notifications, RIGHT arm only.
// Two sub-types:
//   type=1: Mic on/off — f3.f1=1(on), f3.f1=3(off)
//           Perfectly correlates with audio stream start/stop on 0x6402 LEFT arm
//   type=8: AI processing state — f10.f1=2 ★ NEW
//           Appears during active AI session, between mic-on and mic-off
//           Capture 2: t=100.1s and t=106.9s (during speech recognition)
//
// C6 mic session (t=260-272s):
//   t=260.7s type=1 f3.f1=1  → MIC ON  (audio starts on LEFT arm)
//   t=271.9s type=1 f3.f1=3  → MIC OFF (audio stops, ~11s session)
message MicStatePush {
  uint32 type = 1;                     // 1=mic, 8=AI processing
  uint32 msg_id = 2;                  // Sequential
  MicStatePushPayload state = 3;      // type=1
  MicAIProcessing ai_state = 10;      // type=8
}

message MicStatePushPayload {
  MicState mic_state = 1;             // 1=active, 3=stopped
}

message MicAIProcessing {
  uint32 state = 1;                    // 2 = AI processing active
}

// 0x07-20: Dashboard Command (phone→glasses, write-only)
// Text display on glasses, mic control commands
message DashboardCommand {
  uint32 type = 1;
  uint32 msg_id = 2;
  DashboardWidget widget = 3;
}

message DashboardWidget {
  uint32 widget_type = 1;
  bytes content = 2;
}


// =============================================================================
// SERVICE 0x08: AI VOICE SESSION [app: EvenAIDataPackage extended session]
// =============================================================================
// Features: AI Voice Assistant — voice input → AI text response on RIGHT.
//           Also handles translator (EN→FR voice-to-text) sessions.
//           Full lifecycle: init → screen context → mic → token stream → teardown.
// Previously "Init Probe" (1 packet in C1). Capture 3 reveals full AI voice
// session protocol with 38+15 packets. Service handles end-to-end AI voice
// interaction: init → screen context → mic → token streaming → teardown.

// 0x08-00: AI Voice Session ACK (glasses→phone, 38 packets) ★ NEW
// Phone→glasses response/ack during active AI voice session.
// Active from t=199s to t=245s (entire AI voice flow).
//
// Sub-types by field 1:
//   type=1:  Session init ACK — f3=(empty)
//   type=7:  Render heartbeat — f5=(empty), ~1s interval during AI text display
//   type=8:  Token ACK / status — f9={1:1} (token received, ~0.5s burst)
//                                  f6=(empty) (processing status)
//   (none):  Simple ACK — no type field, f2+f3=(empty) only
//
// Timeline (capture 3, t=199-245s):
//   t=199.4s type=1    → Session ACK
//   t=203-214s (none)  → Simple ACKs interspersed
//   t=214-219s type=8  → Token received burst (f9={1:1} at ~0.5s)
//   t=220-245s type=7  → Render HB (~1s while displaying AI response)
//   t=220-244s (none)  → Simple ACKs interspersed with type=7
message AIVoiceSessionAck {
  uint32 type = 1;                     // 1, 7, 8, or absent
  uint32 msg_id = 2;                  // Sequential: 147→203
  AIVoiceAckPayload ack = 3;          // type=1 or no-type: (empty)
  AIVoiceRenderHB render = 5;         // type=7: render heartbeat (empty)
  AIVoiceStatusAck status = 6;        // type=8: processing status (empty)
  AIVoiceTokenAck token_ack = 9;      // type=8: token received {f1=1}
}

message AIVoiceAckPayload {
  // Empty in all observed packets — simple ACK
}

message AIVoiceRenderHB {
  // Empty — signals AI text rendering active on display (~1s interval)
}

message AIVoiceStatusAck {
  // Empty — processing status ack
}

message AIVoiceTokenAck {
  uint32 received = 1;                // 1 = token received successfully
}

// 0x08-01: AI Voice Session Push (glasses→phone, 1/15/7 packets)
// Glasses-initiated AI voice session lifecycle. Full lifecycle in C3.
// C5 confirms shorter sessions: init → context → tokens → teardown (no mic/phase).
//
//   type=1:  Session init — f3=(empty) (first packet in session)
//   type=4:  Screen context — f8 contains current app name ("Home") + page
//            f8.f1 bytes decode as "Home" ASCII (0x486F6D65)
//            f8.f4=page (1 in C5, 2 in C3) — varies by session context
//   type=13: Session teardown — f3=(empty) (last packet, was sole C1 packet)
//   type=14: Mic state — f9.f1=2(mic opened), f9.f1=1(mic closed)
//   type=15: Token streaming — f10.f1=N (AI response token IDs)
//            C3: 3, 21, 14, 331, 52, 61, 23, 31 (at ~1s intervals)
//            C5: 90, 1, 348, 356 (at ~1-2s intervals, shorter session)
//   type=16: Phase A start — f3=(empty) (not in C5 — optional)
//   type=17: Phase B start — f3=(empty) (not in C5 — optional)
//
// C5 timeline (t=129-165s, shorter than C3):
//   t=129.2s type=1   → session init
//   t=132.5s type=4   → current screen "Home" (page=1)
//   t=132.9s type=15  → token 90
//   t=133.9s type=15  → token 1
//   t=137.9s type=15  → token 348
//   t=138.9s type=15  → token 356
//   t=165.5s type=13  → session teardown
//
// Note: types 14, 16, 17 (mic state, phase markers) are optional.
// C5 went directly from context → tokens → teardown without mic/phase events.
message AIVoiceSessionPush {
  uint32 type = 1;                     // 1, 4, 13, 14, 15, 16, 17
  AIVoiceSessionPayload payload = 3;  // types 1,13,16,17: (empty)
  AIVoiceScreenContext screen = 8;    // type=4: current screen info
  AIVoiceMicState mic = 9;           // type=14: mic open/close
  AIVoiceToken token = 10;           // type=15: AI response token ★
}

message AIVoiceSessionPayload {
  // Empty — used by types 1 (init), 13 (teardown), 16/17 (phase start)
}

message AIVoiceScreenContext {
  AIVoiceScreenName name = 1;        // Contains app name bytes ("Home")
  uint32 page = 4;                    // 1=home (C5), 2=home (C3) — varies
}

message AIVoiceScreenName {
  // Protobuf decoder sees nested fields due to "Home" bytes (0x486F6D65)
  // being valid protobuf wire format. Actual content is string "Home".
  // f9=111 (0x6F='o') is an artifact of nested decode.
  uint32 name_bytes = 9;              // 111 = 0x6F, artifact of "Home" decode
}

message AIVoiceMicState {
  uint32 state = 1;                    // 2=mic opened, 1=mic closed
}

message AIVoiceToken {
  uint32 token_id = 1;                // AI response token/word ID
  // Values: 3, 21, 14, 331, 52, 61, 23, 31 (appear to be word indices)
}


// =============================================================================
// SERVICE 0x09: DEVICE INFO / STATE [app: dev_infomation, dev_settings]
// =============================================================================

// 0x09-00: Device Info ACK (glasses→phone, 4/35 packets)
// Init: type=1 ACK(f3.f9.f5=1) + type=2 full state
// Late session: Settings feedback via type=1 with varied f3 sub-fields:
//   f3.f1.f2=N:  Volume changed (values: 24,32,38,48 observed)
//   f3.f2.f1=N:  Brightness changed (values: 2→12, cycling up/down)
//   f3.f2=(empty): Brightness reset/default
//   f3.f3.f1=N:  Notification setting (1=on, 2=off?)
//   f3.f3=(empty): Notification default
//   f3.f6=(empty): Display settings response (rare)
//   f3.f9.f5=1:  Standard ACK (init phase)
//
// Capture 2 late-session settings sequence (t=170-210s):
//   t=170s  f3.f6=(empty)      — display settings ACK
//   t=174s  f3.f1.f2=48        — volume set to 48
//   t=177s  f3.f1.f2=32        — volume set to 32
//   t=179s  f3.f1.f2=24        — volume set to 24
//   t=181s  f3.f1.f2=38        — volume set to 38
//   t=185s  f3.f2.f1=8→f1=12  — brightness cycling up
//   t=189s  f3.f2.f1=10→f1=2  — brightness cycling down
//   t=199s  f3.f3.f1=2, f3.f3.f1=1 — notification toggle
message DeviceInfoAck {
  uint32 type = 1;                     // 1=ACK/settings, 2=full state
  uint32 msg_id = 2;
  DeviceInfoAckPayload payload = 3;   // type=1: varied sub-fields
  DeviceState state = 4;              // type=2: full device state
}

message DeviceInfoAckPayload {
  DeviceVolumeChange volume = 1;      // f1.f2=N when volume changes
  DeviceBrightnessChange brightness = 2; // f2.f1=N when brightness changes
  DeviceNotificationChange notification = 3; // f3.f1=N for notification setting
  DeviceDisplaySettingsAck display = 6;  // f6=(empty) display settings ACK
  DeviceInfoAckSub sub = 9;           // f9.f5=1 standard ACK (init)
}

message DeviceVolumeChange {
  uint32 level = 2;                    // Volume level: 24, 32, 38, 48 observed
}

message DeviceBrightnessChange {
  uint32 level = 1;                    // Brightness: 2-12 observed, 0=default
}

message DeviceNotificationChange {
  uint32 state = 1;                    // 1=enabled?, 2=disabled?
}

message DeviceDisplaySettingsAck {
  // Empty — acknowledges display settings change
}

message DeviceInfoAckSub {
  uint32 status = 5;                   // 1 = success
}

// 0x09-01: Device State Push (glasses→phone, 10/26 packets)
// Periodic device state reports — firmware, battery, volume, brightness
// Three sub-types:
//   type=2: Full state (majority) — rich device info including FW version
//   type=3: Brief status (2-3 packets) — {f5.f2=0 or 1}
// msg_ids in 1003-1045 range (glasses-initiated, high sequence numbers)
// Interval: variable (~5-20s), RIGHT arm only
//
// Late-session state reflection (capture 2, t=166-210s):
//   State.f2 (brightness) changes: 60 → 48 → 38 at volume/brightness changes
//   State.f3 (fw_minor) changes: 7 → 11 → 12 → 3 (reflects brightness settings)
//   State.f4 (field4) changes: 1 → 2 when notification settings toggle
message DeviceStatePush {
  uint32 type = 1;                     // 2=full, 3=brief
  uint32 msg_id = 2;                  // 1003→1012 (glasses-initiated)
  DeviceState state = 4;              // type=2
  DeviceStateBrief brief = 5;         // type=3
}

// Full device state (shared by 0x09-00 type=2 and 0x09-01 type=2)
// Contains firmware version string "2.0.7.16" embedded in raw bytes
message DeviceState {
  uint32 field1 = 1;                   // Present in some (value=1)
  uint32 brightness = 2;              // Display brightness: 45, 35 observed
  uint32 firmware_minor = 3;          // 7 (matches "2.0.7.16")
  uint32 field4 = 4;                   // Always 1
  DeviceVersionWrapper fw_left = 5;   // Left arm firmware info
  DeviceVersionWrapper fw_right = 6;  // Right arm firmware info
  uint32 field7 = 7;                   // Always 1
  uint32 volume = 8;                   // 30 observed
  uint32 field10 = 10;                // Always 1
  uint32 auto_brightness = 11;        // 1 (present in some packets, not others)
  uint32 battery_percent = 12;        // 100 observed (0-100)
  uint32 field18 = 18;                // Always 1
  // NOTE: Raw protobuf also contains firmware string bytes for "2.0.7.16"
  //       at nested positions within fields 5 and 6
}

message DeviceVersionWrapper {
  DeviceVersionInner inner = 6;
}

message DeviceVersionInner {
  uint32 build_number = 6;            // 46 observed
}

message DeviceStateBrief {
  uint32 status = 2;                   // 0 or 1
}


// =============================================================================
// SERVICE 0x0B: CONVERSATE [app: ConversateDataPackage, ConversateCommandId]
// =============================================================================
// Features: Conversate (live transcription/listening+redacting on RIGHT),
//           Translator (EN→FR voice-to-text). Displays real-time transcribed
//           text on the RIGHT display during voice sessions.
// Third feature-specific heartbeat+state service (alongside 0x05 AI, 0x06 Teleprompter).
// Active during Conversate (long-form conversation) sessions, t=131-155s.
// Same type code patterns: 162 (0xA2) heartbeat, 161 (0xA1) state push.

// 0x0B-00: Conversate Heartbeat (glasses→phone, 39 packets) ★ NEW
// Rapid keep-alive during active Conversate session (~0.5s interval).
// Always type=162 with empty f9. msg_ids 90→131 (some gaps).
// Correlates with 0x0D-01 f3.f1=11 (Conversate screen active).
//
// Timing: t=131.77s to t=155.01s (~23s active window)
// Bracketed by 0x0B-01 state pushes (start=131.57s, end=154.71s)
message ConversateHeartbeat {
  uint32 type = 1;                     // Always 162 (0xA2)
  uint32 msg_id = 2;                  // Sequential: 90→131
  ConversateHeartbeatPayload keepalive = 9; // Always empty
}

message ConversateHeartbeatPayload {
  // Empty in all 39 observed packets — pure keep-alive signal
  // NOTE: uses field 9, unlike AI (field 7) and Teleprompter (field 12)
}

// 0x0B-01: Conversate State Push (glasses→phone, 2 packets) ★ NEW
// Session lifecycle events — same pattern as AIStatePush (0x05-01).
// Type=161 (0xA1) with f8.f1 = state code.
//
// Timeline (capture 3):
//   t=131.57s  type=161 f8.f1=1  → Conversate session START (msg_id=1)
//   t=154.71s  type=161 f8.f1=2  → Conversate session END  (msg_id=130)
message ConversateStatePush {
  uint32 type = 1;                     // Always 161 (0xA1)
  uint32 msg_id = 2;                  // 1 (start) → 130 (end)
  ConversateSessionState session = 8; // f8.f1 = state
}

message ConversateSessionState {
  uint32 state = 1;                    // 1=start, 2=end
}


// =============================================================================
// SERVICE 0x0C: QUICKLIST / TASKS [app: QuicklistDataPackage, eQuicklistCommandId]
// =============================================================================

// 0x0C-00: Tasks ACK (glasses→phone, 1/1/8 packets)
// Three sub-types confirmed in capture 3:
//   type=1: Task detail — f3.f1=task_id (uint32), f3.f2=confirmed (1)
//   type=2: Task list ACK — f4.f1=1 (success), optional f4.f2=1 (has tasks)
//
// Capture 3 timeline:
//   t=18-49s   type=2 f4={1:1}      — init task list (×4, incl double init)
//   t=97.5s    type=1 f3={1:491654398, 2:1} — task 0x1D56197E confirmed
//   t=97.9-100s type=2 f4={1:1, 2:1} — task list with confirmed flag
message TasksAck {
  uint32 type = 1;                     // 1=detail, 2=list
  uint32 msg_id = 2;
  TaskDetailPayload detail = 3;       // type=1: specific task info
  TasksAckPayload payload = 4;        // type=2: list ACK (field 4, not 3)
}

message TaskDetailPayload {
  uint32 task_id = 1;                  // e.g., 491654398 (0x1D56197E)
  uint32 confirmed = 2;               // 1 = task confirmed/acknowledged
}

message TasksAckPayload {
  uint32 status = 1;                   // 1 = success
  uint32 has_tasks = 2;               // 1 = tasks present (C3), absent in init
}


