//   Capture 2 (132707): 1842 packets, 24 services (teleprompter + AI + settings)
//   Capture 3 (134915): 1788 packets, 27 services (AI voice + Conversate + reconnect)
//   Capture 4 (141920): 365 packets, 24 services (silent mode + app runtime 0xE0)
//   Capture 5 (144331): 350 packets, 25 services (AI+Conversate+Voice+App combo)
//   Capture 6 (150306): 277 packets, 27 services (notifications+conversate+tele+translate+AI)
//   Capture 7 (153320): 108 packets, 17 services (dashboard navigation + ring scroll)
//
// ============================================================================
// HARDWARE
// ============================================================================
// Three BLE peripherals:
//   Left arm:   Even G2_32_L_1DAD73  (audio source — mic streams on LEFT only)
//   Right arm:  Even G2_32_R_4A56B4  (primary control, dashboard, device info)
//   R1 Ring:    884A62D5             (input controller — tap, scroll, long press)
// Firmware: 2.0.7.16
// BLE UUID base: 00002760-08c2-11e1-9073-0e8ac72e{XXXX}
//
// ============================================================================
// GATT TABLE (per arm — identical on both)
// ============================================================================
// Service 0x1001  "System"    Char 0x0001 (write) / 0x0002 (notify)
// Service 0x5450  "Protocol"  Char 0x5401 (write) / 0x5402 (notify) ← main data
// Service 0x6450  "Display"   Char 0x6401 (write) / 0x6402 (notify) ← +mic audio
// Service 0x7450  "Audio"     Char 0x7401 (write) / 0x7402 (notify) ← UNUSED
//
// Audio streams on 0x6402 LEFT arm (not 0x7402 despite name).
// MTU: 527 bytes. Connection: LE with lmHandle per device.
//
// ============================================================================
// TRANSPORT — 0xAA FRAMED PACKETS (on 0x5401/0x5402)
// ============================================================================
// [0xAA] [dir] [seq] [len_hi] [len_lo] [pkt_tot] [pkt_ser] [svc_hi] [svc_lo] [payload] [crc16]
//
//   dir:     0x21=phone→glasses, 0x12=glasses→phone
//   seq:     monotonic (wraps 0xFF)
//   len:     payload_len + 2 (CRC)
//   pkt_tot: total packets in multi-packet message
//   pkt_ser: packet index (0-based)
//   svc_hi:  service category
//   svc_lo:  direction suffix:
//              0x00 = glasses→phone ACK/response
//              0x01 = glasses→phone data push (unsolicited)
//              0x20 = phone→glasses command
//              0x21 = phone→glasses data push
//   CRC:     CRC-16/CCITT (init 0xFFFF) over payload, little-endian
//
// ============================================================================
// AUDIO TRANSPORT — RAW LC3 (on 0x6402 LEFT arm, NO 0xAA framing)
// ============================================================================
// 205 bytes/pkt: 5 × 40B LC3 frames + 4B metadata + 1B counter
// LC3: 16kHz, 10ms frames, 32kbps. Rate: ~20.1 pkt/s, ~100.5 frames/s.
// Counter at byte[204], monotonic across mic on/off gaps (no lost packets).
// Mic trigger: only via EvenAI on glasses main menu (NOT from BLE commands).
//
// ============================================================================
