// =============================================================================
// SERVICE 0x80: HEARTBEAT / KEEP-ALIVE [app: BASE_CONNECT_HEART_BEAT]
// =============================================================================

// 0x80-00: Heartbeat (glasses→phone, 13/29/43 packets)
// Multi-phase heartbeat, both LEFT and RIGHT arms:
//   Init phase (t=17-18s):
//     type=4:   Init heartbeat (L and R arms)
//     type=5:   Init secondary
//     type=128: Special init (only once, {f128:(empty)})
//   Early session (t=25s):
//     type=6:   Session established
//   Periodic (every ~15s, alternating L/R) ★ CONFIRMED C3:
//     type=14:  Keep-alive with empty f13 — 32 of 43 packets in C3!
//              Alternates: LEFT arm → ~2s → RIGHT arm → ~13s → repeat
//              Most common packet type in long sessions.
//
// Write command 0x80-20 confirmed working for heartbeat.
// SyncMessage(type=0x0E) sent on 0x80-20, glasses echo on 0x80-00.
message Heartbeat {
  uint32 type = 1;                     // 4, 5, 6, 14, 128
  uint32 msg_id = 2;
  HeartbeatPayload init = 3;          // type=4
  HeartbeatPayload init2 = 4;         // type=5
  HeartbeatPayload early = 5;         // type=6
  HeartbeatPayload periodic = 13;     // type=14 (main keep-alive)
  HeartbeatPayload special = 128;     // type=128 (init only)
}

message HeartbeatPayload {
  // Always empty in all observed packets across all types
}

// 0x80-01: Heartbeat Data (glasses→phone, 12 packets)
// Periodic heartbeat with optional status, RIGHT arm only:
//   Init (t=17s):
//     type=4:  {f3.f1=1} — init ACK with status
//   Periodic (every ~10s):
//     type=6:  {f5:(empty)} or {f5.f1=1} — keep-alive response
//   msg_ids: 64→211 over 85s (incrementing by ~15-18 per interval)
message HeartbeatData {
  uint32 type = 1;                     // 4, 6
  uint32 msg_id = 2;                  // 64→211
  HeartbeatDataPayload init = 3;      // type=4: {f1=1}
  HeartbeatDataPayload periodic = 5;  // type=6: empty or {f1=1}
}

message HeartbeatDataPayload {
  uint32 status = 1;                   // 0 (empty) or 1
}

// 0x80-20: Heartbeat Command (phone→glasses, write-only)
// Confirmed working: SyncMessage with type=0x0E triggers heartbeat exchange
message HeartbeatCommand {
  uint32 type = 1;                     // 0x0E = sync trigger
  uint32 msg_id = 2;
  bytes data = 13;                     // Empty (tag 0x6A, 0x00)
}


